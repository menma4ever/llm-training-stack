name: CI - Clean Build & Isolated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Clean Build Distribution Wheel
        run: |
          python -m build --wheel --outdir dist/

      - name: Verify Wheel Artifact
        shell: bash
        run: |
          ls -la dist/
          test -f dist/*.whl

      - name: Create Isolated Virtual Environment
        run: |
          python -m venv ci_venv

      - name: Install Wheel in Isolated Environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ci_venv/Scripts/activate
          else
            source ci_venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl -c constraints.txt
          python -m pip check

      - name: CLI Entry Point Verification
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ci_venv/Scripts/activate
          else
            source ci_venv/bin/activate
          fi
          train-stack --help
          train-stack inspect

      - name: Run Smoke Test Suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ci_venv/Scripts/activate
          else
            source ci_venv/bin/activate
          fi
          python -m pip install pytest pytest-cov
          pytest tests/test_config.py tests/test_provenance.py tests/test_cli.py -v
